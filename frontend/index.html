<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Placement Portal</title>
  <meta name="description" content="Connect students with top companies through your college placement cell.">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

  <div class="text-center px-4">
    <h1 class="text-4xl font-bold text-white mb-3">🎓 Campus Placement Portal</h1>
    <p class="text-white/80 text-lg mb-10">Browse jobs, apply, and track your campus placement journey.</p>

    <div class="flex gap-4 justify-center">
      <a href="pages/login.html"
         class="bg-white text-indigo-700 font-semibold px-6 py-3 rounded-lg hover:bg-indigo-50 transition shadow">
        Login
      </a>
      <a href="pages/register.html"
         class="bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-indigo-800 transition shadow border border-white/20">
        Register
      </a>
    </div>
  </div>

  <button id="theme-btn" onclick="toggleTheme()"
          class="fixed top-4 right-4 bg-white/20 text-white px-3 py-2 rounded-lg hover:bg-white/30 transition"
          title="Toggle dark mode">🌙</button>

  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/theme.js"></script>
</body>
</html>
