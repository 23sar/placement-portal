<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications — Placement Portal</title>
  <meta name="description" content="Track the status of your job applications.">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors">

<script>window.LOGIN_URL = '../login.html';</script>

<div class="flex h-screen overflow-hidden">

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside class="w-64 bg-gray-900 text-white p-5 flex flex-col flex-shrink-0">
    <h2 class="text-xl font-bold mb-8">🎓 Placement Portal</h2>
    <nav>
      <ul class="space-y-1">
        <li><a href="dashboard.html"
               class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
          <i class="fa-solid fa-house w-4"></i> Dashboard
        </a></li>
        <li><a href="my-applications.html"
               class="flex items-center gap-3 px-3 py-2 rounded bg-blue-700 font-semibold">
          <i class="fa-solid fa-file-lines w-4"></i> My Applications
        </a></li>
      </ul>
    </nav>
    <div class="mt-auto pt-6 border-t border-gray-700 text-sm">
      <p class="text-gray-400">Logged in as</p>
      <p id="user-name" class="font-semibold text-white">—</p>
      <p id="user-role" class="text-xs text-blue-400 capitalize">—</p>
    </div>
  </aside>

  <!-- ── Main ───────────────────────────────────────────────── -->
  <div class="flex-1 overflow-y-auto p-6">

    <!-- Topbar -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">My Applications</h1>
      <div class="flex gap-3">
        <button id="theme-btn" onclick="toggleTheme()"
                class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-2 rounded hover:opacity-80 transition">🌙</button>
        <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition text-sm">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-12 text-gray-400">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
      <p>Loading your applications…</p>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-12 text-gray-400">
      <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
      <p class="text-lg">No applications yet.</p>
      <a href="dashboard.html" class="mt-3 inline-block text-blue-500 hover:underline">Browse Jobs →</a>
    </div>

    <!-- Table -->
    <div id="table-container" class="hidden bg-white dark:bg-gray-800 rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-300 uppercase text-xs">
          <tr>
            <th class="px-6 py-3">#</th>
            <th class="px-6 py-3">Job Title</th>
            <th class="px-6 py-3">Company</th>
            <th class="px-6 py-3">Location</th>
            <th class="px-6 py-3">Stipend</th>
            <th class="px-6 py-3">Applied On</th>
            <th class="px-6 py-3">Status</th>
          </tr>
        </thead>
        <tbody id="applications-body" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="../../assets/js/core/config.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/theme.js"></script>
<script src="../../assets/js/pages/student-applications.js"></script>
</body>
</html>
