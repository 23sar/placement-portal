<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/core/core.js"></script></head>
<body><div class="auth"><aside><a class="brand" href="../index.html">Placement<i>Portal</i></a><div><h1>Your next role starts here.</h1><p>One place for campus openings, applications and decisions.</p></div><span></span></aside><main><form id="register"><h2>Create your account</h2><p class="muted">It takes under a minute.</p>
<label>I am a…</label><div class="roles"><label><input type="radio" name="role" value="student" checked><span>Student</span></label><label><input type="radio" name="role" value="company"><span>Company</span></label></div>
<label for="name">Full name or company name</label><input id="name" name="name" required autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="password">Password (6+ characters)</label><input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
<p class="err" id="err" role="alert"></p><button class="btn" type="submit">Create account</button>
<p class="alt muted">Already registered? <a href="login.html">Sign in</a></p></form></main></div>
<script src="../assets/js/pages/auth.js"></script></body></html>
