<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — Placement Portal</title>
  <meta name="description" content="Post new internship and placement opportunities for students.">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors">

<script>window.LOGIN_URL = '../login.html';</script>

<div class="flex h-screen overflow-hidden">

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside class="w-64 bg-gray-900 text-white p-5 flex flex-col flex-shrink-0">
    <h2 class="text-xl font-bold mb-8">🏢 Company Portal</h2>
    <nav>
      <ul class="space-y-1">
        <li><a href="dashboard.html"
               class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
          <i class="fa-solid fa-house w-4"></i> Dashboard
        </a></li>
        <li><a href="post-job.html"
               class="flex items-center gap-3 px-3 py-2 rounded bg-blue-700 font-semibold">
          <i class="fa-solid fa-plus-circle w-4"></i> Post a Job
        </a></li>
      </ul>
    </nav>
    <div class="mt-auto pt-6 border-t border-gray-700 text-sm">
      <p class="text-gray-400">Logged in as</p>
      <p id="user-name" class="font-semibold text-white">—</p>
      <p id="user-role" class="text-xs text-blue-400 capitalize">—</p>
    </div>
  </aside>

  <!-- ── Main ───────────────────────────────────────────────── -->
  <div class="flex-1 overflow-y-auto p-6">

    <!-- Topbar -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">Post a New Job</h1>
      <div class="flex gap-3">
        <button id="theme-btn" onclick="toggleTheme()"
                class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-2 rounded hover:opacity-80 transition">🌙</button>
        <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition text-sm">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
        </button>
      </div>
    </div>

    <!-- Form container -->
    <div class="max-w-2xl bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <form id="post-job-form" class="space-y-4">
        <div>
          <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Job Title *</label>
          <input type="text" id="title" required placeholder="e.g. Frontend Engineer Intern"
                 class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="location" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Location *</label>
          <input type="text" id="location" required placeholder="e.g. Remote / Bangalore, India"
                 class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="stipend" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Stipend / Salary (₹ / month)</label>
          <input type="number" id="stipend" placeholder="e.g. 35000 (optional)" min="0" step="1000"
                 class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Job Description *</label>
          <textarea id="description" required rows="5" placeholder="Detail the responsibilities, requirements, and qualifications…"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <p id="error-msg" class="text-red-500 text-sm font-medium"></p>
        <p id="success-msg" class="text-green-500 text-sm font-medium"></p>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="post-btn"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded transition">
            Post Job
          </button>
          <a href="dashboard.html"
             class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-5 py-2.5 rounded hover:opacity-80 transition text-center">
            Cancel
          </a>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="../../assets/js/core/config.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/theme.js"></script>
<script src="../../assets/js/pages/company-post-job.js"></script>
</body>
</html>
