<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications — Campus Placement Portal</title>
  <meta name="description" content="Track your job applications and their current statuses.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <div class="w-64 bg-gray-900 text-white p-5 flex flex-col flex-shrink-0">
    <h2 class="text-2xl font-bold mb-8">
      <i class="fa-solid fa-graduation-cap mr-2"></i>Placement Portal
    </h2>

    <nav>
      <ul class="space-y-2">
        <li>
          <a href="dashboard.html"
             class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
            <i class="fa-solid fa-house"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="dashboard.html#jobs-section"
             class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
            <i class="fa-solid fa-briefcase"></i> Jobs
          </a>
        </li>
        <li>
          <a href="applications.html"
             class="flex items-center gap-3 px-3 py-2 rounded bg-blue-700 font-semibold transition">
            <i class="fa-solid fa-file-lines"></i> My Applications
          </a>
        </li>
      </ul>
    </nav>

    <div class="mt-auto pt-6 border-t border-gray-700">
      <p class="text-sm text-gray-400">Logged in as</p>
      <p class="font-semibold text-white" id="user-name">—</p>
      <p class="text-xs text-blue-400 capitalize" id="user-role">—</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-6 overflow-y-auto">

    <!-- Topbar -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">My Applications</h1>

      <div class="flex items-center space-x-3">
        <button onclick="toggleTheme()"
                class="bg-gray-200 dark:bg-gray-700 px-3 py-2 rounded text-gray-700 dark:text-gray-200 hover:opacity-80 transition"
                title="Toggle dark mode">
          🌙
        </button>
        <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
        </button>
      </div>
    </div>

    <!-- Applications Table -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
      <div class="p-5 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-white">
          <i class="fa-solid fa-list-check mr-2 text-blue-500"></i>Application History
        </h2>
      </div>

      <!-- Loading state -->
      <div id="loading" class="p-8 text-center text-gray-500 dark:text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p>Loading your applications...</p>
      </div>

      <!-- Empty state (hidden by default) -->
      <div id="empty-state" class="p-8 text-center text-gray-500 dark:text-gray-400 hidden">
        <i class="fa-solid fa-folder-open text-4xl mb-3 text-gray-300"></i>
        <p class="text-lg">No applications yet.</p>
        <a href="dashboard.html" class="mt-3 inline-block text-blue-500 hover:underline">
          Browse available jobs →
        </a>
      </div>

      <!-- Applications table (hidden until data loads) -->
      <div id="table-container" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 uppercase text-xs">
            <tr>
              <th class="px-6 py-3 text-left">#</th>
              <th class="px-6 py-3 text-left">Job Title</th>
              <th class="px-6 py-3 text-left">Company</th>
              <th class="px-6 py-3 text-left">Location</th>
              <th class="px-6 py-3 text-left">Stipend</th>
              <th class="px-6 py-3 text-left">Applied On</th>
              <th class="px-6 py-3 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="applications-body" class="divide-y divide-gray-200 dark:divide-gray-700">
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/applications.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
