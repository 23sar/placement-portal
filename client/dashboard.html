<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Campus Placement Portal</title>
  <meta name="description" content="Your placement dashboard — view jobs, applications, and status updates.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <div class="w-64 bg-gray-900 text-white p-5 flex flex-col flex-shrink-0">
    <h2 class="text-2xl font-bold mb-8">
      <i class="fa-solid fa-graduation-cap mr-2"></i>Placement Portal
    </h2>

    <nav>
      <ul class="space-y-2">
        <li>
          <a href="dashboard.html" id="nav-dashboard"
             class="flex items-center gap-3 px-3 py-2 rounded hover:bg-blue-600 transition font-semibold bg-blue-700">
            <i class="fa-solid fa-house"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="#jobs-section" id="nav-jobs"
             class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
            <i class="fa-solid fa-briefcase"></i> Jobs
          </a>
        </li>
        <li>
          <a href="applications.html" id="nav-applications"
             class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-700 transition">
            <i class="fa-solid fa-file-lines"></i> My Applications
          </a>
        </li>
      </ul>
    </nav>

    <!-- User info at bottom -->
    <div class="mt-auto pt-6 border-t border-gray-700">
      <p class="text-sm text-gray-400">Logged in as</p>
      <p class="font-semibold text-white" id="user-name">—</p>
      <p class="text-xs text-blue-400 capitalize" id="user-role">—</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-6 overflow-y-auto">

    <!-- Topbar -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">Dashboard</h1>

      <div class="flex items-center space-x-3">
        <button onclick="toggleTheme()" id="theme-btn"
                class="bg-gray-200 dark:bg-gray-700 px-3 py-2 rounded text-gray-700 dark:text-gray-200 hover:opacity-80 transition"
                title="Toggle dark mode">
          🌙
        </button>
        <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
        </button>
      </div>
    </div>

    <!-- Stats cards — populated from API -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
      <div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow">
        <h2 class="text-gray-500 dark:text-gray-400 text-sm">Total Applications</h2>
        <p class="text-3xl font-bold text-gray-800 dark:text-white mt-1" id="stat-total">—</p>
      </div>
      <div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow">
        <h2 class="text-gray-500 dark:text-gray-400 text-sm">Shortlisted</h2>
        <p class="text-3xl font-bold text-green-600 mt-1" id="stat-shortlisted">—</p>
      </div>
      <div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow">
        <h2 class="text-gray-500 dark:text-gray-400 text-sm">Rejected</h2>
        <p class="text-3xl font-bold text-red-500 mt-1" id="stat-rejected">—</p>
      </div>
    </div>

    <!-- Jobs section -->
    <div id="jobs-section" class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white">
          <i class="fa-solid fa-briefcase mr-2 text-blue-500"></i>Available Jobs
        </h2>
        <!-- Search bar -->
        <input type="text" id="job-search" placeholder="Search jobs..."
               oninput="filterJobs()"
               class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700
                      text-gray-800 dark:text-white rounded px-3 py-1 text-sm focus:outline-none
                      focus:ring-2 focus:ring-blue-500 w-48">
      </div>

      <div id="jobs" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/jobs.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
